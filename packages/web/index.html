    <title>NULLRADIX</title>
    <script>
      // Farbschema vor dem ersten Zeichnen setzen (Wert aus theme.ts/applyTheme), damit kein heller Blitz entsteht
      (function () {
        // Installierte Themes: theme.css-URL und Startfarbe aus dem Cache (theme.ts: THEME_CSS_CACHE_KEY, THEME_START_COLOR_KEY)
        var builtin = ["nullradix", "system", "light", "dark"];
        var mode = "nullradix";
        var css = null;
        var color = null;
        try {
          mode = localStorage.getItem("harness-theme-mode") || "nullradix";
          css = localStorage.getItem("harness-theme-css");
          color = localStorage.getItem("harness-theme-start-color");
        } catch (e) {}
        if (!/^[a-z0-9-]{2,40}$/.test(mode)) mode = "nullradix";
        // Ein installiertes Theme gilt nur mit passender theme.css-URL, sonst „system“
        if (builtin.indexOf(mode) < 0 && css !== "/themes/" + mode + "/theme.css") mode = "system";
        // Abgesicherter Modus (?safe-theme): kein Theme-CSS, nur hell/dunkel nach System
        if (builtin.indexOf(mode) < 0 && /[?&]safe-theme(=|&|$)/.test(location.search)) mode = "system";
        var root = document.documentElement;
        var dark = mode === "dark" || mode === "nullradix" || (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = mode === "nullradix" || mode === "system" || mode === "light" || mode === "dark" ? (dark ? "dark" : "light") : mode;
        root.dataset.themeMode = mode;
        if (builtin.indexOf(mode) < 0) {
          var link = document.createElement("link");
          link.id = "nullradix-theme-css";
          link.rel = "stylesheet";
          // In der Desktop-App liegt die theme.css beim lokalen Server, nicht bei den Dateien der App (nullradixBridge.ts: serverUrl)
          var app = window.__NULLRADIX__;
          link.href = (app && app.base && app.token ? app.base : "") + css;
          document.head.appendChild(link);
          if (color && /^#[0-9a-fA-F]{3,8}$/.test(color)) root.style.setProperty("--start-color", color);
        }
      })();
    </script>
    <style>
      /* Startanimation: NR-Zeichen und Schriftzug NULLRADIX werden aufgezogen, dann blendet das Overlay aus. Hintergründe = --bg je Schema (variables.css) */
      #start-anim { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--start-color, #f7f7f8); color: #111114; transition: opacity 0.3s ease; }
      [data-theme="dark"] #start-anim { background: #0c0c0e; color: #f4f4f5; }
      [data-theme-mode="nullradix"] #start-anim { background: #08080a; color: #e4e4e7; }
      #start-anim svg { display: block; fill: currentColor; }
      #start-anim .nr-mark { width: min(132px, 26vw); height: auto; animation: nr-wipe 0.7s cubic-bezier(0.7, 0, 0.2, 1) both; }
      #start-anim .nr-word { width: min(380px, 70vw); height: auto; animation: nr-wipe 0.8s cubic-bezier(0.7, 0, 0.2, 1) 0.45s both; }
      #start-anim .nr-rule { width: min(380px, 70vw); height: 2px; background: currentColor; opacity: 0.25; transform-origin: left; animation: nr-rule 1.1s cubic-bezier(0.7, 0, 0.2, 1) 0.2s both; }
      @keyframes nr-wipe { from { clip-path: inset(0 100% 0 0); transform: translateY(6px); } to { clip-path: inset(0 0 0 0); transform: none; } }
      @keyframes nr-rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      #start-anim.is-done { opacity: 0; pointer-events: none; }
    </style>
  </head>

    <script>
      // Startanimation einmal zeigen, dann ausblenden; ohne Bewegung sofort weg
      (function () {
        var box = document.getElementById("start-anim");
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return box.remove();
        setTimeout(function () {
          box.classList.add("is-done");
          setTimeout(function () { box.remove(); }, 300);
        }, 1700);
      })();
    </script>
