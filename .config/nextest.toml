[profile.default]
# a test that leaves pipes open has leaked a process; detached runs must not
leak-timeout = { period = "500ms", result = "fail" }
# name a hanging test after a minute and stop it after five
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# the hook latency tests measure time, so they run alone and get one retry on a loaded machine
[test-groups]
hook-timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(nullradix-cli) and binary(hooks)"
test-group = "hook-timing"
retries = 1
