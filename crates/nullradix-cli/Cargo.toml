[package]
name = "nullradix-cli"
description = "Kommandozeile von NULLRADIX"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nullradix_cli"
path = "src/lib.rs"

# Das Binary heißt `nullradix`; in Hilfe und Beispielen steht bis P3-16 weiter „harness“,
# damit der CLI-Vertrag aus contract/cli unverändert grün bleibt.
[[bin]]
name = "nullradix"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
nullradix-core = { workspace = true }
nullradix-db = { workspace = true }
# `nullradix serve` startet den Rust-Server samt Node-Sidecar im eigenen Prozess
nullradix-platform = { workspace = true }
nullradix-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
# Die Board-Fixture für Tests steckt im Merkmal `testing` des Fachkerns.
nullradix-core = { workspace = true, features = ["testing"] }
predicates = { workspace = true }
tempfile = { workspace = true }
# Kaputte Pakete (ohne theme.css) für `tests/theme_manage.rs`
zip = { workspace = true }

[lints]
workspace = true
