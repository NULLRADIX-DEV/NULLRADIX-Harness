name: PR

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^[a-z].{0,59}$
          subjectPatternError: The subject must start lowercase and stay under 60 characters.
          ignoreLabels: dependencies
      - if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'nullradix-harness[bot]'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          body="$(printf '%s' "$BODY" | tr -d '\r')"
          if [ -z "$body" ] || [ "$(printf '%s' "$body" | wc -l)" -gt 0 ] || [ "${#body}" -gt 120 ]; then
            echo "The PR body must be one short sentence."
            exit 1
          fi
