version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    commit-message:
      prefix: build
  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns: ['*']
    commit-message:
      prefix: build
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # only the digest moves; the Rust version follows rust-toolchain.toml by hand
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: node
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
