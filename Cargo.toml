[workspace]
resolver = "3"
members = ["apps/cli", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/NULLRADIX-DEV/NULLRADIX-Harness"
publish = false

[workspace.dependencies]
nullradix-api = { path = "crates/api" }
nullradix-app = { path = "crates/app" }
nullradix-client = { path = "crates/client" }
nullradix-domain = { path = "crates/domain" }
nullradix-os = { path = "crates/os" }
nullradix-store = { path = "crates/store" }

anyhow = "1.0.105"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http-body-util = "0.1.3"
getrandom = "0.4.3"
open = "5.4.5"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
toml = "1.2.2"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "request-id", "set-header", "trace", "util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
uuid = "1.29.3"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"

[profile.release]
lto = "thin"
strip = true
